name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'

      - name: PHP 8.4 syntax
        run: find plugins -name '*.php' -print0 | xargs -0 -n 1 php -l

      - name: Each plugin's plugin.json
        run: php scripts/check-plugins.php

      # ChurchCRM release (for PHPStan), PHPStan and ChurchCRM's plugin scan,
      # pinned by SHA-256 in the script.
      - name: Review tools
        run: |
          scripts/fetch-tools.sh "$RUNNER_TEMP/tools"
          echo "CHURCHCRM_DIR=$RUNNER_TEMP/tools/churchcrm" >> "$GITHUB_ENV"

      # PHPStan analyses the plugins with ChurchCRM's code (classes, Propel
      # models, Slim): a missing import or a wrong call is rejected.
      - name: PHPStan
        run: php -d memory_limit=1G "$RUNNER_TEMP/tools/phpstan.phar" analyse --no-progress --error-format=github

      # ChurchCRM's own review scan for community plugins: manifest, file
      # types, dangerous functions, outbound hosts, file writes.
      - name: ChurchCRM plugin scan
        run: |
          for dir in plugins/*/; do
            php "$RUNNER_TEMP/tools/plugin-scan.php" "$dir"
          done

      - name: Zip build check (not published)
        run: |
          for dir in plugins/*/; do
            scripts/build.sh "$(basename "$dir")"
          done
