name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CHURCHCRM_VERSION: 7.8.0
  CHURCHCRM_SHA256: 0a2efd069bdeaa9535f76ca3e347f2e729890a8ad7951d7692fec0d060296fb1
  PHPSTAN_VERSION: 2.3.3
  PHPSTAN_SHA256: aa5cc7543f0de0ae7997deb24f654a3b2454b6ba4ba2c4552957a175886b60b1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'

      - name: Syntaxe PHP 8.4
        run: find plugins -name '*.php' -print0 | xargs -0 -n 1 php -l

      - name: plugin.json de chaque plugin
        run: php scripts/check-plugins.php

      # PHPStan analyse les plugins avec le code de ChurchCRM (classes, modèles
      # Propel, Slim) : un import manquant ou un mauvais appel est refusé.
      - name: ChurchCRM et PHPStan
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o churchcrm.zip "https://github.com/ChurchCRM/CRM/releases/download/$CHURCHCRM_VERSION/ChurchCRM-$CHURCHCRM_VERSION.zip"
          curl -fsSL -o phpstan.phar "https://github.com/phpstan/phpstan/releases/download/$PHPSTAN_VERSION/phpstan.phar"
          echo "$CHURCHCRM_SHA256  churchcrm.zip" | sha256sum -c -
          echo "$PHPSTAN_SHA256  phpstan.phar" | sha256sum -c -
          unzip -q churchcrm.zip
          echo "CHURCHCRM_DIR=$RUNNER_TEMP/churchcrm" >> "$GITHUB_ENV"

      - name: PHPStan
        run: php -d memory_limit=1G "$RUNNER_TEMP/phpstan.phar" analyse --no-progress --error-format=github

      - name: Zip de chaque plugin
        run: |
          for dir in plugins/*/; do
            scripts/build.sh "$(basename "$dir")"
          done
