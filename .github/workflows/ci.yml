name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Syntaxe PHP 8.4
        run: find plugins -name '*.php' -print0 | xargs -0 -n 1 php -l

      - name: Zip de chaque plugin
        run: |
          for dir in plugins/*/; do
            scripts/build.sh "$(basename "$dir")"
          done
